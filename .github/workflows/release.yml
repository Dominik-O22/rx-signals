name: Release

# Publishing a GitHub release (tag vX.Y.Z, all packages at X.Y.Z) publishes every
# package to npm with provenance and attaches attested tarballs to the release.
on:
  release:
    types: [published]

permissions: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: write # upload tarballs to the release
      id-token: write # npm trusted publishing and provenance, artifact attestations
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # Trusted publishing needs npm >= 11.5.1.
      - run: npm install -g npm@11
      - run: pnpm install --frozen-lockfile
      - run: node scripts/release.mjs check "$TAG"
        env:
          TAG: ${{ github.event.release.tag_name }}
      - run: pnpm typecheck && pnpm test && pnpm build
      - run: pnpm -r pack --pack-destination "$GITHUB_WORKSPACE/artifacts"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: artifacts/*.tgz
      # NPM_TOKEN exists only for the very first publish: npm can only trust this
      # workflow for packages that already exist. Delete the secret afterwards.
      - run: |
          if [ -n "$NPM_TOKEN" ]; then
            echo "//registry.npmjs.org/:_authToken=$NPM_TOKEN" > "$HOME/.npmrc"
          fi
          node scripts/release.mjs publish artifacts "$DIST_TAG"
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          DIST_TAG: ${{ github.event.release.prerelease && 'next' || 'latest' }}
      - run: gh release upload "$TAG" artifacts/*.tgz --clobber
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
